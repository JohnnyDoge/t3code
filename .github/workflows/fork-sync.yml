name: Fork sync

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: fork-main
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

defaults:
  run:
    shell: bash

jobs:
  sync:
    if: github.repository != 'pingdotgg/t3code' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        id: setup
        uses: ./.github/actions/setup-ci-deps
        with:
          install: "false"

      - name: Restore Git conflict resolutions
        id: rerere
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/rr-cache
          key: fork-rerere-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fork-rerere-v1-

      - name: Rebase and check
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p .git/rr-cache
          bash scripts/fork/sync-upstream.sh --dry-run

      - name: Save Git conflict resolutions
        id: cache
        if: ${{ !cancelled() && steps.sync.outcome != 'skipped' && steps.rerere.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/rr-cache
          key: ${{ steps.rerere.outputs.cache-primary-key }}

      - name: Push checked main
        id: push
        if: steps.sync.outputs.rebased == 'true'
        env:
          GH_TOKEN: ${{ secrets.FORK_PUSH_TOKEN }}
          ORIGINAL_SHA: ${{ steps.sync.outputs.original_sha }}
        run: |
          : "${GH_TOKEN:?FORK_PUSH_TOKEN is required}"
          gh auth setup-git --hostname github.com --force
          bash scripts/fork/sync-upstream.sh --push "$ORIGINAL_SHA"

      - name: Update sync failure issue
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
          TARGET_TAG: ${{ steps.sync.outputs.target_tag }}
          FAILURE: ${{ steps.sync.outputs.failure || steps.push.outputs.failure }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          RERERE_OUTCOME: ${{ steps.rerere.outcome }}
          CACHE_OUTCOME: ${{ steps.cache.outcome }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
        run: |
          title="fork-sync failed"
          issue=$(gh issue list --state open --limit 1000 --json number,title \
            --jq '[.[] | select(.title == "fork-sync failed")][0].number // empty')
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [[ $JOB_STATUS == success ]]; then
            if [[ -n $issue ]]; then
              gh issue close "$issue" --comment "Fork sync succeeded on ${TARGET_TAG:-the current nightly}. $run_url"
            fi
            exit 0
          fi

          if [[ -z $FAILURE ]]; then
            if [[ $CHECKOUT_OUTCOME == failure ]]; then FAILURE="checkout main"
            elif [[ $SETUP_OUTCOME == failure ]]; then FAILURE="set up Vite+"
            elif [[ $RERERE_OUTCOME == failure ]]; then FAILURE="restore rerere cache"
            elif [[ $CACHE_OUTCOME == failure ]]; then FAILURE="save rerere cache"
            elif [[ $PUSH_OUTCOME == failure ]]; then FAILURE="authenticate the main push"
            else FAILURE="initialize the rebase step"
            fi
          fi
          body="$RUNNER_TEMP/fork-sync-failure.md"
          printf 'Target nightly: `%s`\n\nFailed at: %s\n\nRun: %s\n' \
            "${TARGET_TAG:-unknown}" "$FAILURE" "$run_url" > "$body"
          if [[ -n $issue ]]; then
            gh issue comment "$issue" --body-file "$body"
          else
            gh issue create --title "$title" --body-file "$body"
          fi
