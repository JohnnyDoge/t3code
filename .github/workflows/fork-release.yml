name: Fork desktop release

on:
  schedule:
    - cron: "43 6 * * 0"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if main is already released
        type: boolean
        default: false

concurrency:
  group: fork-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORK_RELEASE_TAGS_QUERY: >-
    .[] | select(.isPrerelease and .name == ("T3 Code Fork " + .tagName)) |
    .tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+-nightly\\.[0-9]{8}\\.[0-9]+$"))

defaults:
  run:
    shell: bash

jobs:
  plan:
    if: github.repository != 'pingdotgg/t3code' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ref: ${{ steps.release.outputs.ref }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps
        with:
          install: "false"

      - name: Plan release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FORCE: ${{ inputs.force }}
        run: |
          ref=$(git rev-parse HEAD)
          previous_tags=$(gh release list --exclude-drafts --limit 100 --json tagName,name,isPrerelease \
            --jq "$FORK_RELEASE_TAGS_QUERY" | sort -Vr)
          previous_tag=${previous_tags%%$'\n'*}
          if [[ -n $previous_tag && $FORCE != true ]]; then
            previous_ref=$(git rev-parse --verify "refs/tags/$previous_tag^{commit}")
            if [[ $previous_ref == "$ref" ]]; then
              echo "main is already released as $previous_tag."
              exit 0
            fi
          fi

          upstream_tag=$(bash scripts/fork/sync-upstream.sh --upstream-base)
          version=$(node scripts/fork/release-version.ts "$upstream_tag" "$(date -u +%Y%m%d)" \
            "$GITHUB_RUN_NUMBER" "$previous_tag")
          printf 'ref=%s\nversion=%s\n' "$ref" "$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    needs: plan
    if: github.repository != 'pingdotgg/t3code' && needs.plan.outputs.version != ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            arch: arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
            resource_monitor: t3-resource-monitor
          - platform: win
            arch: x64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            resource_monitor: t3-resource-monitor.exe
    steps:
      - name: Enable Git long paths
        if: matrix.platform == 'win'
        run: git config --global core.longpaths true

      - name: Checkout release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Cache native resource monitor
        id: resource_monitor
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/resource-monitor/target/${{ matrix.rust_target }}/release/${{ matrix.resource_monitor }}
          key: fork-resource-monitor-${{ matrix.rust_target }}-${{ hashFiles('.cargo/config.toml', 'native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Build native resource monitor
        if: steps.resource_monitor.outputs.cache-hit != 'true'
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target "$RUST_TARGET"

      - name: Build macOS desktop artifacts
        if: matrix.platform == 'mac'
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          FORK_MAC_CERT_P12_BASE64: ${{ secrets.FORK_MAC_CERT_P12_BASE64 }}
          FORK_MAC_CERT_PASSWORD: ${{ secrets.FORK_MAC_CERT_PASSWORD }}
        run: node scripts/fork/build-desktop.ts --platform mac --arch arm64 --version "$VERSION" --out "$RUNNER_TEMP/fork-desktop"

      - name: Build Windows desktop artifacts
        if: matrix.platform == 'win'
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
        run: node scripts/fork/build-desktop.ts --platform win --arch x64 --version "$VERSION" --out "$RUNNER_TEMP/fork-desktop"

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-desktop-${{ matrix.platform }}
          path: ${{ runner.temp }}/fork-desktop/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          overwrite: true

  publish:
    needs: [plan, build]
    if: github.repository != 'pingdotgg/t3code'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fork-desktop-*
          path: release-assets

      - name: Publish prerelease and retain eight releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REF: ${{ needs.plan.outputs.ref }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          tag="v$VERSION"
          shopt -s nullglob
          mac=release-assets/fork-desktop-mac
          win=release-assets/fork-desktop-win
          dmgs=("$mac"/*.dmg)
          zips=("$mac"/*.zip)
          installers=("$win"/*.exe)
          if [[ ! -s "$mac/nightly-mac.yml" || ! -s "$win/nightly.yml" ]] ||
             (( ${#dmgs[@]} == 0 || ${#zips[@]} == 0 || ${#installers[@]} == 0 )); then
            echo "::error::Missing nightly updater metadata or desktop installers."
            exit 1
          fi
          mapfile -d '' -t assets < <(find "$mac" "$win" -type f -print0)
          declare -A asset_names
          for asset in "${assets[@]}"; do
            name=${asset##*/}
            if [[ ${asset_names[$name]+present} ]]; then
              echo "::error::Duplicate release asset name: $name"
              exit 1
            fi
            asset_names[$name]=1
          done

          # The updater can discover the release as soon as it becomes public.
          existing=$(gh release view "$tag" --json name,isDraft \
            --jq '[.name, (.isDraft | tostring)] | @tsv' \
            2>/dev/null) || existing=
          case "$existing" in
            "")
              gh release create "$tag" --draft --prerelease --latest=false --target "$RELEASE_REF" \
                --title "T3 Code Fork $tag" --notes "Desktop build from $RELEASE_REF." "${assets[@]}"
              ;;
            "T3 Code Fork $tag"$'\t'true) gh release upload "$tag" --clobber "${assets[@]}" ;;
            "T3 Code Fork $tag"$'\t'false) ;;
            *) echo "::error::Release tag $tag is already in use." && exit 1 ;;
          esac
          if [[ $existing != "T3 Code Fork $tag"$'\t'false ]]; then
            gh release edit "$tag" --draft=false --prerelease --latest=false
          fi

          published=$(gh release list --exclude-drafts --limit 100 --json tagName,name,isPrerelease \
            --jq "$FORK_RELEASE_TAGS_QUERY")
          expired=$(printf '%s\n%s\n' "$tag" "$published" | sort -Vru | tail -n +9)
          while IFS= read -r previous; do
            [[ -n $previous ]] || continue
            gh release delete "$previous" --cleanup-tag --yes
          done <<< "$expired"
